# router.ts uses real History-API paths (/, /chat) via pushState, not
# hash routing -- a plain nginx static server would 404 on a direct load
# or refresh of /chat since no such file exists on disk. This fallback
# sends any unmatched path to index.html so the client-side router (not
# nginx) decides what to render.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
